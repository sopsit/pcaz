    <script>


        function loadProducts() {
            fetch("http://localhost:8080/api/SazgarYab", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === "successful") {
                    localStorage.setItem("product", JSON.stringify(data.product));
                    displayProducts(data.product);
                } else {
                    alert("Invalid credentials");
                }
            })
            .catch(error => console.error("Error:", error));

        function displayProducts(products) {
            const productList = document.getElementById("productList");
            productList.innerHTML = ""; // Clear previous content

            products.forEach((product, index) => {
                const optionDiv = document.createElement("div");
                optionDiv.classList.add("option");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.name = "product";
                checkbox.value = product.P_model;
                checkbox.id = "product" + index; // Ensure unique ID
                checkbox.dataset.brand = product.P_brand;
                checkbox.dataset.model = product.P_model;
                checkbox.dataset.category = product.P_category;
                checkbox.dataset.price = product.P_currentprice;

                const customCheckbox = document.createElement("div");
                customCheckbox.classList.add("checkbox-custom");

                const label = document.createElement("label");
                label.htmlFor = checkbox.id; // Correctly links the label to the checkbox
                label.textContent = `${product.P_brand} - ${product.P_model} ($${product.P_currentprice})`;

                // Ensure clicking on the custom checkbox selects the real checkbox
                customCheckbox.addEventListener("click", () => {
                    checkbox.checked = !checkbox.checked;
                    customCheckbox.classList.toggle("checked", checkbox.checked); // Add a class for styling
                });

                optionDiv.appendChild(checkbox);
                optionDiv.appendChild(customCheckbox);
                optionDiv.appendChild(label);
                productList.appendChild(optionDiv);
            });
        }
        }
        function getCompatibleProducts() {
        // Get all selected checkboxes
        const selectedProducts = [];
        const checkboxes = document.querySelectorAll('input[name="product"]:checked');
            
        // Loop through checked checkboxes and gather their data
        checkboxes.forEach(checkbox => {
            selectedProducts.push({
                ProductBrand: checkbox.dataset.brand, 
                ProductModel: checkbox.dataset.model, 
                ProductCategory: checkbox.dataset.category 
            });
            // console.log("chera:  ",checkbox.dataset.brand)
        });
        // console.log("pr: ",selectedProducts )

        // no product is selected
        if (selectedProducts.length === 0) {
            alert("Please select at least one product.");
            return;
        }

        // Send selected data to the server
        fetch("http://localhost:8080/api/getSazgarProduct", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(selectedProducts)  
  
        })
        .then(response => response.json())
        .then(data => {
            if (data.message === "successful") {
                // Handle the response (the compatible products)
                displayProducts(data.product);  // Assuming the response includes the compatible products
                console.log("saz: ", selectedProducts)
            } else {
                alert("Error fetching compatible products");
            }
        })
        .catch(error => console.error("Error:", error));
    }

    // Display the compatible products
        function displayProducts(products) {
            
            const productList = document.getElementById("SproductList");
            productList.innerHTML = ""; 
            products.forEach((product) => {
                const productElement = document.createElement("div");
                productElement.classList.add("product-item");
                productElement.innerHTML = `
                    <p>${product.P_brand} - ${product.P_model} (${product.P_currentprice})</p>
                    <p>Stock Count: ${product.P_Stock_count}</p>
                `;
                productList.appendChild(productElement);
            });
        }

        window.onload = loadProducts();


    </script>
</body>
