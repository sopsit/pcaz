<body>

          <div class="down_row">

            <div class="col" style="width: 35%; background-color: #181818; border-radius: 10px; ">
                <div class="row txt" style=" position: absolute; left:1000px; font-size: 1.5rem;">

            <div class="filter">

                    <div class="txt" style="position: absolute; left:1400px; font-size: 2rem;">

                </div>
                <div class="row">
                    <div class="txt" style="position: absolute; left:1320px;">
                        دسته بندی کالا ها

                </div>
                <div class="row" style="height: 70%;">
                    <div class="col txt" style="width: 100%; height: 100%;  ">

                        <label class="option" >
                            <input type="checkbox">

                            Case
                        </label>

                    </div>
                </div>
            </div>

          </div>

    </div>
    <script>


         function loadProducts() {
            fetch("http://localhost:8080/api/SazgarYab", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === "successful") {
                    localStorage.setItem("product", JSON.stringify(data.product));
                    displayProducts(data.product);
                } else {
                    alert("Invalid credentials");
                }
            })
            .catch(error => console.error("Error:", error));

            function displayProducts(products) {
            const productList = document.getElementById("productList");
            productList.innerHTML = ""; // Clear previous content

            products.forEach((product, index) => {
                const optionDiv = document.createElement("div");
                optionDiv.classList.add("option");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.name = "product";
                checkbox.value = product.P_model;
                checkbox.id = "product" + index; // Ensure unique ID

                const customCheckbox = document.createElement("div");
                customCheckbox.classList.add("checkbox-custom");

                const label = document.createElement("label");
                label.htmlFor = checkbox.id; // Correctly links the label to the checkbox
                label.textContent = `${product.P_brand} - ${product.P_model} ($${product.P_currentprice})`;

                // Ensure clicking on the custom checkbox selects the real checkbox
                customCheckbox.addEventListener("click", () => {
                    checkbox.checked = !checkbox.checked;
                    customCheckbox.classList.toggle("checked", checkbox.checked); // Add a class for styling
                });

                optionDiv.appendChild(checkbox);
                optionDiv.appendChild(customCheckbox);
                optionDiv.appendChild(label);
                productList.appendChild(optionDiv);
            });
        }


        }
        window.onload = loadProducts();




    </script>
</body>
