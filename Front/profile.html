    <div class="v_line">

                </div>

                </div>
                <div class="pic">

            <div class="introduction">

                       : کیف پول

                        : سود ماهانه
                        <i class="fa-solid fa-money-bill-1 fa-lg" style="color: #ffffff;"></i>
                    </div>
                </div>
                
            </div>
            <div class="introduction">
                <div class="int1">

                    <select name="Adress" id="addreses" style="height: 50%; background-color: #171717; border: 2px solid #7EAE74;border-radius: 5px; color: white; margin-top: 10%;">
                        
                    </select>
                </div>
                <div class="int2">
                    <div class="o_txt" style="padding-right: 30%;">

                        <i class="fa-solid fa-location-dot fa-lg"></i>

            </div>

    </div>
    <script>
        function openCity(evt, buttn_name) {
             var i, tabcontent, tablinks;
             tabcontent = document.getElementsByClassName("tabcontent");
             for (i = 0; i < tabcontent.length; i++) {
            //  tabcontent[i].style.display = "none";
             }
             tablinks = document.getElementsByClassName("tablinks");
             for (i = 0; i < tablinks.length; i++) {
             tablinks[i].className = tablinks[i].className.replace(" active", "");
             }
            document.getElementById(buttn_name).style.display = "block";
             evt.currentTarget.className += " active";
         }
        const storedUser = localStorage.getItem("user")
        const storestatus = localStorage.getItem("status")
        const storecount = localStorage.getItem("count_ref")
        const storetime = localStorage.getItem("remaining")
        const storeper = localStorage.getItem("fiftyPer")
        const  storedAddresses = localStorage.getItem("addresses")
        const storeDifcount = localStorage.getItem("dif_count")
        const storeCart = localStorage.getItem("cart")
        // console.log(storeCart)
        window.onload = function() {
            if (storedUser) {
                
                const user = JSON.parse(storedUser)
                
                if (user.name) { 
                    document.getElementById('name').textContent = user.name; // Use lowercase if backend sends "name"
                } 
                if (user.lastname) { 
                    document.getElementById('Lname').textContent = user.lastname; // Use lowercase if backend sends "name"
                } 
                if (user.signuptime) { 
                    document.getElementById('date').textContent = user.signuptime; // Use lowercase if backend sends "name"
                }
                if (user.walletbalance) { 
                    document.getElementById('wallet').textContent = user.walletbalance; // Use lowercase if backend sends "name"
                }
                if (user.referralcode) { 
                    document.getElementById('ref_code').textContent = user.referralcode; // Use lowercase if backend sends "name"
                }
                if (storestatus) {
                    document.getElementById('status').textContent = storestatus;
                }
                if (storestatus) {
                    document.getElementById('status').textContent = storestatus;
                }
                if (storecount) {
                    document.getElementById('count_ref').textContent = storecount;
                }
                if (storetime) {
                    document.getElementById('time').textContent = storetime;
                }
                if (storeper) {
                    document.getElementById('fiftyP').textContent = storeper;
                }
                if (storedAddresses) {
                    const addresses = JSON.parse(storedAddresses);
                    const selectElement = document.getElementById("addreses");
                    
                    selectElement.innerHTML = ""; // Clear existing options
                    addresses.forEach(address => {
                        const option = document.createElement("option");
                        option.value = address;
                        option.textContent = address;
                        selectElement.appendChild(option);
                    });
                }
                if(storeDifcount) {
                    document.getElementById('ref_dis_code').textContent  =storeDifcount;
                }
                if (storeCart) {
                    try {
                        const cartArray = JSON.parse(storeCart); 
                        const container = document.getElementById("cart_container"); 

                        container.innerHTML = ""; // Clear previous content

                        if (Array.isArray(cartArray) && cartArray.length > 0) {
                            cartArray.forEach(cart => {
                                const p = document.createElement("p");
                                p.textContent = `Cart number ${cart.Cartnum}  -> ${cart.Carts}`;
                                container.appendChild(p);
                            });
                        } else {
                            container.innerHTML = "<p>No cart data available.</p>";  // ✅ Handle empty array
                        }
                    } catch (error) {
                        console.error("Error parsing cart data:", error);
                    }
                }

            }
        };


    </script>
    
</body>
